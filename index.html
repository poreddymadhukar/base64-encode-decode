<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f3" />
    <meta name="author" content="Mariutil" />
    <meta
      name="description"
      content="Generate QR codes from URLs or text instantly with Mariutil's free online QR Code Generator. Create and download PNG or SVG QR codes directly in your browser."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://qr.mariutil.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mariutil" />
    <meta property="og:url" content="https://qr.mariutil.com/" />
    <meta
      property="og:title"
      content="QR Code Generator - Free Online QR Code Generator | Mariutil"
    />
    <meta
      property="og:description"
      content="Generate and download QR codes from URLs or text directly in your browser."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://qr.mariutil.com/" />
    <meta name="twitter:title" content="QR Code Generator | Mariutil" />
    <meta
      name="twitter:description"
      content="Generate QR codes from URLs or text directly in your browser."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Mariutil QR Code Generator",
        "url": "https://qr.mariutil.com/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "A free browser-based QR code generator that processes content locally.",
        "featureList": [
          "Generate QR codes from URLs and plain text",
          "Download QR codes as PNG or SVG",
          "Copy QR code content",
          "Client-side QR code generation"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What can I use this QR code generator for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You can create a QR code from any URL, plain text, phone number, or email text."
            }
          },
          {
            "@type": "Question",
            "name": "Is my content uploaded?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. QR code generation happens locally in your browser, and your content is never uploaded."
            }
          },
          {
            "@type": "Question",
            "name": "Can I download the QR code?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Download the generated QR code as a high-resolution PNG or scalable SVG file."
            }
          }
        ]
      }
    </script>
    <title>QR Code Generator - Free Online QR Code Generator | Mariutil</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
